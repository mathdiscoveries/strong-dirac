# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Planar Point Sets with at Most floor(n/2) Lines Through Every Point for All n >= 8 and an Infinite Refutation of Grunbaum's 2010 Conjecture"
  description: >-
    Unconditional Lean 4 + Mathlib formalization in the Euclidean plane R^2 proving:
    (1) every n >= 8 admits a non-collinear n-point set with every point incident to
    at most floor(n/2) connecting lines (self-contained across all 12 residue classes
    modulo 12, reconstructing Felsner's family for several classes and adding an explicit
    8-deletion construction for n = 12k + 11, k >= 2); (2) three infinite straight-line
    knight-lattice families with deficit 5/2 below n/2 (n = 60s + 53 and n = 60s + 69
    for all s >= 0, and n = 60s + 61 for all s >= 1); and (3) a refutation of
    Grunbaum's 2010 conjecture G(n) = 2 * floor(n/4) by at least 2 across four
    infinite congruence classes modulo 60. Companion write-ups and logged prior-work
    searches (arXiv, CORE, Google Scholar as of 2026-11-22, and surveys through
    2025) are published at mathdiscoveries.org/results/few-lines-through-every-point;
    neither the
    n = 12k + 11 construction nor infinite straight-line families with deficit > 3/2
    were found in those logged searches; Grunbaum (1972) and most of the
    print monographs remain unread [to check].
    Coverage by this package's Palomar comparison: none of the companion
    paper's 7 main results is compared in Lean in full, and 3 are compared in
    part, all over the reals: Theorem 1 (the bound floor(n/2) for every
    n >= 8 and its odd case, not the exact maximum 6j + 5 of the rational grid
    S_K); Theorem 2 (5 of its 12 classes modulo 60: the odd classes 53, 9 and
    1 with exact maximum (n - 5)/2, and the even classes 52 and 8 with an
    upper bound only); Proposition 3 (family A, without its rationality
    claim). This package's Lean library proves Theorems 1 and 2 and
    Proposition 3 as stated, with their rational configurations and
    exact maxima (StrongDirac.ExactEqualities: thm_half, thm_knights,
    familyA_odd_rational_exact), and Lemmas 4, 5, 6 and 7, but compares
    only the parts above; Conjecture 8 is open and not counted.
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

classification:
  arxiv: ["math.CO", "math.MG"]
  msc2020: ["52C10", "52C30"]

sources:
  - title: "Arrangements of n points whose incident-line-numbers are at most n/2"
    authors:
      - "Jin Akiyama"
      - "Hiro Ito"
      - "Midori Kobayashi"
      - "Gisaku Nakamura"
    id: "https://www.jaist.ac.jp/~uehara/JCCGG09/submissions/jccgg2009_submission_56.pdf"
    type: other
    location: "Two-page abstract, Japan Conference on Computational Geometry and Graphs (JCCGG), 2009"
    relationship: independently-proves
    note: >-
      Read in full. A two-page conference abstract, not indexed by the
      bibliographic databases, with the same title as the authors' 2011
      journal paper (next entry). It poses the problem of a non-collinear
      n-point set with at most floor(n/2) connecting lines through every
      point for every n >= 8, and reports constructions for even n >= 8,
      n = 4k + 9 and n = 12k + 15 (k >= 0) and for n = 11, with Felsner's
      arrangement for n = 12k + 19; n = 12k + 23 is left open.
      dirac_counterexample_all_ge_8 proves these cases again, self-contained.
  - title: "Arrangements of n Points whose Incident-Line-Numbers are at most n/2"
    authors:
      - "Jin Akiyama"
      - "Hiro Ito"
      - "Midori Kobayashi"
      - "Gisaku Nakamura"
    id: "https://doi.org/10.1007/s00373-011-1023-4"
    type: paper
    location: "Graphs and Combinatorics 27(3) (2011), 321-326, Theorem 1.2 (p. 323) and its proof in Section 2"
    relationship: independently-proves
    note: >-
      Read in full (pp. 321-326, a copy obtained through university
      access). Theorem 1.2, p. 323: "Let n be an integer with n >= 8. Then
      there is a set X of n noncollinear points in the plane satisfying
      t(X) <= floor(n/2) except possibly for n = 12k + 11 (k >= 4)." The
      proof, pp. 323-325, covers seven classes: even n, n = 4k + 9,
      12k + 15, 12k + 19 (Felsner's configuration), n = 11, n = 23 and 35
      (deletions from the 24- and 37-point simplicial examples of Table 2),
      and n = 47 (the 49-point set of Fig. 5 with two points deleted).
      dirac_counterexample_all_ge_8 proves the same bound on that range
      again, by its own constructions, and also at n = 12k + 11, k >= 4,
      which the paper leaves open (p. 325).
  - title: "Geometric Graphs and Arrangements: Some Chapters from Combinatorial Geometry"
    authors:
      - "Stefan Felsner"
    id: "https://doi.org/10.1007/978-3-322-80303-0"
    type: book
    location: "Advanced Lectures in Mathematics, Vieweg (2004), Section 5 notes, p. 86, Figure 5.14"
    relationship: independently-proves
    note: >-
      Read p. 86 in the author-hosted copy of the book
      (page.math.tu-berlin.de/~felsner/Buch/gga-book.pdf). In the notes to
      Chapter 5, with r*(n) the minimum, over nontrivial arrangements of n
      lines, of the maximum number of vertices on a line of the arrangement:
      "There
      is a family of arrangements showing that r*(n) <= ceil(n/2) - 2 for
      all n of the form n = 12k + 7, the member of this family with k = 2 is
      shown in Figure 5.14" ("An arrangement of 31 lines (including the line
      at infinity) and at most 14 vertices on each line"). The page gives no
      general construction. felsner_mod12_euclidean (StrongDirac/
      TightnessAndMod12.lean) independently proves the dual bound for
      k >= 1: a non-collinear set of n = 12k + 7 points with every point on
      at most 6k + 2 connecting lines (felsnerSet), which
      dirac_counterexample_all_ge_8 uses for that class. The coordinates of
      felsnerSet were reconstructed from the read accounts of Grunbaum
      (2010, pp. 4-5; credited on the Grunbaum 2010 entry below) and
      Lund-Purdy-Smith (2014, Section 2, p. 2: "This infinite family of
      counterexamples is due to Felsner and contains 6k + 7 points with none
      incident to more than 3k + 2 spanned lines when k is even"), not from
      p. 86. The 1-deletion (12k + 6), the 4-deletion (felsnerDel4, 12k + 3
      and 12k + 2) and the 8-deletion (StrongDirac/R15_2_1.lean, 12k + 11,
      k >= 2) are the package's own; Grunbaum (2010, p. 8) already lists
      one-line deletions of Felsner examples at n = 42 and 54, and the 4- and
      8-deletions are not listed in the sources read.
  - title: "Research Problems in Discrete Geometry"
    authors:
      - "Peter Brass"
      - "William O. J. Moser"
      - "Janos Pach"
    id: "https://doi.org/10.1007/0-387-29929-7"
    type: book
    location: "Springer (2005), Section 7.3, p. 313"
    relationship: background
    note: >-
      Read p. 313 (a copy obtained through university access). After
      Conjecture 4 (the strong Dirac conjecture): "Many small examples listed
      by Grunbaum [Gr72] show that the conjecture is false with c = 0. An
      infinite family of counterexamples was constructed by Felsner
      (personal communication): 6k+7 points, each of them incident to at most
      3k + 2 lines." The bound holds for even k only (Akiyama et al. 2011,
      p. 323: "t(X) = floor(n/2) - 1 when k is even and t(X) = floor(n/2) when
      k is odd"; Grunbaum 2010, p. 5). Felsner's bound is credited on the
      Felsner (2004) entry, and Grunbaum's examples on the Grunbaum (1972)
      entry.
  - title: "Dirac's conjecture concerning high-incidence elements in aggregates"
    authors:
      - "Branko Grunbaum"
    type: paper
    location: "Geombinatorics 20(2) (2010), 48-55"
    relationship: adapts
    note: >-
      Full eight-page author manuscript read. Grunbaum's own contributions
      used here are his conjectured bound G(n) = 2 * floor(n/4) for all
      sufficiently large n, which refutes_grunbaum_2010 refutes by at least 2
      across four infinite congruence classes modulo 60, and his table of the
      smallest known t(n) (p. 8). His account of Felsner's even-parameter
      family, pp. 4-5, with his interpretation of it for n = 19 (Figure 3),
      is the read account from which felsnerSet and its deletions were
      reconstructed; Lund, Purdy and Smith (2014), Section 2, give the
      corroborating account and figures (the dual of the n = 31 member,
      Figure 1, and one wedge of its dihedral construction, Figure 2). His table draws its
      arrangements from the 2009 catalogue (next entry); for n = 23 it lists
      A(24,2) with one line deleted, whereas this package's n = 23 witness
      is A(25,5) with two lines deleted (o23Pts), a different parent; for
      n = 14 and 15 it lists A(15,1) with one line deleted and A(15,1), the
      parents of h3Del1Pts and h3Pts here.
  - title: "A catalogue of simplicial arrangements in the real projective plane"
    authors:
      - "Branko Grunbaum"
    id: "https://doi.org/10.26493/1855-3974.88.e12"
    type: paper
    location: "Ars Mathematica Contemporanea 2 (2009), 1-25"
    relationship: adapts
    note: >-
      The text of all 25 pages of the author's copy was read (introduction,
      notation, the table of all simplicial arrangements with at most 37
      lines, and the captions); the diagrams were not inspected visually.
      Two finite witnesses in StrongDirac/TightnessAndMod12.lean are duals
      of catalogue arrangements: h3Pts is A(15,1) (used at n = 15, and with
      one point deleted, h3Del1Pts, at n = 14), and o23Pts is A(25,5) with
      two points deleted (used at n = 23). The identification was checked
      by computing, from the package's coordinates, the connecting-line
      structure of h3Pts and of o23Pts with the two deleted points
      restored: both match the catalogue's f-, t- and r-vectors exactly
      (A(15,1): f0 = 31, t = (15, 10, 0, 6), every line on 6 vertices;
      A(25,5): f0 = 81, t = (36, 32, 0, 8, 4, 0, 1), r8 = 5, r10 = 20).
      Grunbaum (2010, p. 8) lists the one-line deletion of A(15,1) for
      n = 14. For n = 23 this formalization uses two deletions from A(25,5),
      where his table uses A(24,2) with one line deleted. Lund-Purdy-Smith
      (2014, Section 2) also
      single out A(25,5) from this catalogue.
  - title: "Arrangements and Spreads"
    authors:
      - "Branko Grunbaum"
    id: "https://doi.org/10.1090/cbms/010"
    type: book
    location: "CBMS Regional Conference Series in Mathematics 10, American Mathematical Society (1972), pp. 24-25 [to check]"
    relationship: independently-proves
    note: >-
      The book itself was not read [to check]: it is in print and no copy
      was available. The credit rests on read passages that state its
      results. Akiyama et al. (2011, read in full), p. 322: "the conjecture
      is false as Grunbaum pointed out in [2] (pp. 24-25). He considered a
      set Y of lines in the projective plane ... He constructed sets of lines
      with the values in Table 1", Table 1 giving n(Y) = 9, 15, 19, 25, 31,
      37 with r*(Y) = 4, 6, 8, 10, 12, 16; by duality (their Lemmas C and D)
      these are non-collinear sets of n points with every point on at most
      r*(Y) <= (n - 1)/2 connecting lines. Felsner (2004, p. 86, read):
      "Grunbaum [108] (page 25) gives counterexamples for values of n up to
      37"; Brass, Moser and Pach (2005, p. 313, read): "Many small examples
      listed by Grunbaum [Gr72] show that the conjecture is false with
      c = 0". dirac_counterexample_all_odd_ge_9 proves the bound
      t <= (n - 1)/2 again at these six sizes, by its own constructions; the
      credit is limited to those six existence bounds.
  - title: "Collinearity properties of sets of points"
    authors:
      - "G. A. Dirac"
    id: "https://doi.org/10.1093/qmath/2.1.221"
    type: paper
    location: "Quarterly Journal of Mathematics 2 (1951), 221-227, Conclusion (p. 226 and p. 227)"
    relationship: independently-proves
    note: >-
      Read pp. 221-227 (archive.org item
      sim_quarterly-journal-of-mathematics-oxford-series_1951-09_2_7, the
      September 1951 issue; the OCR text checked against the page images of
      pp. 226-227). With G(n) the least, over configurations of n
      non-collinear points, of the largest number of connecting lines through
      one point, and [x] "the smallest integer not exceeded by x", p. 226
      conjectures G(n) >= [n/2] and continues on pp. 226-227: "it is easy to
      see that this is best-possible, since G(n) = [n/2] for the following
      configurations: if n is even, n/2 - 1 of the points lie on one line,
      n/2 - 1 of the remaining points lie on a second line, and these lines
      meet in the (n - 1)th point; the two ranges are in perspective from the
      nth point. If n is odd, (n - 1)/2 of the points lie on one line,
      (n - 1)/2 of the others lie on a second line; these two ranges are in
      perspective with the nth point." The paper states these values without
      a written verification. For even n this is a non-collinear set of n
      points with every point on at most n/2 connecting lines, the existence
      bound that dirac_counterexample_all_ge_8 proves again for even n >= 8 by
      its own constructions; the credit is limited to that even bound. The
      odd configurations give (n + 1)/2, weaker than the package's odd bound
      (n - 1)/2, and are not credited. The conjecture itself is a different
      statement and is not proved here.
  - title: "On some extremal problem in discrete geometry"
    authors:
      - "Jan Florek"
    id: "https://www.dbc.wroc.pl/publication/21184"
    type: paper
    location: "Mathematical Economics 7(14) (2011), 65-70"
    relationship: independently-proves
    note: >-
      Read in full (Lower Silesian Digital Library copy). Theorem 2.2, p. 68,
      for X_n of "n = 4k, k >= 2, points distributed on the lines p, q, r",
      states "Any point of X_n u {O} belongs to at most n/2 lines spanned by
      X_n u {O}": a non-collinear set of 4k + 1 points with every point on at
      most 2k connecting lines. dirac_counterexample_all_odd_ge_9 and
      dirac_counterexample_all_ge_8 prove that bound again at the sizes
      4k + 1, k >= 2, by their own constructions.
  - title: "On Dirac and Motzkin problem in discrete geometry"
    authors:
      - "Jan Florek"
    id: "https://doi.org/10.1007/s00373-025-02913-w"
    type: paper
    location: "Graphs and Combinatorics 41 (2025), Paper 54; arXiv:2501.18406"
    relationship: background
    note: >-
      Read (arXiv v1, Section 1). Restates the counterexamples of Grunbaum,
      Felsner and Akiyama et al., draws the latter's n = 4k + 1 sets at
      n = 17 (Figures 1-2) and points to Florek's 2011 paper ("see also
      Florek [5]"), credited in its own entry above; it proves a different,
      positive statement.
  - title: "A sporadic simplicial arrangement of 51 lines"
    authors:
      - "Tomas S. R. Silva"
    id: "https://arxiv.org/abs/2610.28874"
    type: paper
    location: "arXiv:2610.28874v2 (2026), Theorem 1.1, p. 2, and Section 6, p. 6"
    relationship: background
    note: >-
      Read (arXiv v2). Constructs a simplicial arrangement A51 of 51 real
      lines; Section 6, p. 6, reports that the verifier "checks that each of
      the 21 original lines contains 20 vertices and each of the 30 added
      lines contains 22". The dual is a non-collinear set of 51 points with
      every point on at most 22 connecting lines, a single size with
      deficit 7/2 (below the bound 25 that dirac_counterexample_all_ge_8
      proves at n = 51, and below Grunbaum's 2 * floor(51/4) = 24). The
      paper does not discuss Dirac's problem; n = 51 is outside the four
      residue classes of refutes_grunbaum_2010.
  - title: "A pseudoline counterexample to the strong Dirac conjecture"
    authors:
      - "Ben Lund"
      - "George B. Purdy"
      - "Justin W. Smith"
    id: "https://doi.org/10.37236/4015"
    type: paper
    location: "Electronic Journal of Combinatorics 21(2) (2014), #P2.31, Section 2, p. 2, Figures 1-2"
    relationship: adapts
    note: >-
      Section 2 read. Its description of Felsner's straight-line family,
      p. 2 ("This infinite family of counterexamples is due to Felsner and
      contains 6k + 7 points with none incident to more than 3k + 2 spanned
      lines when k is even"), with the dual of the n = 31 member (Figure 1)
      and one wedge of its dihedral construction (Figure 2), is one of the
      two accounts from which the coordinates of felsnerSet were
      reconstructed (the other is Grunbaum 2010, pp. 4-5). Felsner's bound
      is credited on the Felsner (2004) entry. The paper's main theorem, a
      pseudoline arrangement family with unbounded deficit, concerns
      pseudolines and is outside this comparison.
  - title: "Projective Duality, Unexpected Hypersurfaces and Logarithmic Derivations of Hyperplane Arrangements"
    authors:
      - "Bill Trok"
    id: "https://arxiv.org/abs/2003.02397"
    type: paper
    location: "arXiv:2003.02397 (2020), Section 9 (pp. 39-41)"
    relationship: background
    note: >-
      Recent survey/paper consulted in the prior-work check noting that all
      known infinite straight-line counterexample families satisfied deficit at
      most 3/2 and citing the open n = 12k + 11 case of Akiyama et al. (2011).
  - title: "The Dirac-Goodman-Pollack Conjecture"
    authors:
      - "Adrian Dumitrescu"
    id: "https://arxiv.org/abs/2204.06101"
    type: paper
    location: "Discrete & Computational Geometry 72(2) (2024), 728-742; arXiv:2204.06101"
    relationship: background
    note: >-
      Recent literature consulted in the prior-work check (alongside Florek,
      arXiv:2501.18406, 2025) confirming Felsner's deficit-3/2 family and the
      open n = 12k + 11 gap remained the recorded state of knowledge in the
      open arXiv literature.
  - title: "Real Point Sets with Few Lines Through Every Point: All n >= 8 and Twelve Modulo-60 Families"
    authors:
      - "Tyler B. Hughes"
    id: "https://mathdiscoveries.org/results/few-lines-through-every-point"
    type: paper
    location: "https://mathdiscoveries.org/results/few-lines-through-every-point"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The companion paper. It states and proves in writing every compared
      statement of this package (Theorem 1, Theorem 2(1), Proposition 3 and
      Table 1 rows A, B and C), and the Lean work formalizes them; the
      formalization presents no result that the paper does not. The 11
      residue classes of Akiyama, Ito, Kobayashi and Nakamura are printed
      prior work, listed above; the proof of them here is a second proof.
      Felsner's bound (Felsner 2004, p. 86, entry above) is proved again
      with coordinates reconstructed from Grunbaum's (2010) and
      Lund-Purdy-Smith's (2014) accounts of his family, and two arrangements of Grunbaum's 2009 catalogue are
      adapted. Logged prior-work searches (arXiv, CORE on 2026-11-20, Google
      Scholar on 2026-11-22, and the 2014-2025 surveys listed above) found
      neither the punctured grid for n = 12k + 11 nor an infinite
      straight-line family with deficit exceeding 3/2; no exhaustive priority
      claim is made. Akiyama et al. (2011) was read in full; of Felsner
      (2004) only p. 86 and of Brass-Moser-Pach (2005) only p. 313 were
      read, and Dirac (1951) was read; Grunbaum (1972) remains unread
      [to check]. AI research agents built
      and directed by Tyler B. Hughes generated and checked this work. No human
      mathematician has yet refereed the proof.

